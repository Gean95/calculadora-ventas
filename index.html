<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Ventas</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:15px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#059669;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.btn-calcular{
    background:#10b981;
}

.btn-whatsapp{
    background:#25D366;
}

.resultado{
    margin-top:20px;
    background:#ecfdf5;
    padding:15px;
    border-radius:15px;
}

.resultado p{
    margin:8px 0;
}

.precio{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#059669;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="card">

<h1>💰 Calculadora de Ventas</h1>

<label>Producto</label>
<input type="text" id="producto">

<label>Costo Unitario del Producto (S/)</label>
<input type="number" id="costo" step="0.01">

<label>Cantidad Comprada</label>
<input type="number" id="cantidad" value="1">

<label>Pasajes Totales (S/)</label>
<input type="number" id="pasajes" value="0" step="0.01">

<label>Otros Gastos Totales (S/)</label>
<input type="number" id="otros" value="0" step="0.01">

<label>Ganancia (%)</label>
<input type="number" id="ganancia" value="60">

<button class="btn-calcular" onclick="calcular()">
📊 Calcular
</button>

<button class="btn-whatsapp" onclick="enviarWhatsApp()">
📱 Compartir por WhatsApp
</button>

<div class="resultado">

<p><strong>Pasaje por unidad:</strong>
<span id="pasajeUnidad">S/ 0.00</span></p>

<p><strong>Otros gastos por unidad:</strong>
<span id="otrosUnidad">S/ 0.00</span></p>

<p><strong>Costo real unitario:</strong>
<span id="costoReal">S/ 0.00</span></p>

<p><strong>Ganancia por unidad:</strong>
<span id="gananciaUnidad">S/ 0.00</span></p>

<p><strong>Precio venta unitario:</strong>
<span id="precioUnitario">S/ 0.00</span></p>

<p><strong>Stock total:</strong>
<span id="stockTotal">0</span></p>

<p><strong>Inversión total:</strong>
<span id="inversionTotal">S/ 0.00</span></p>

<p><strong>Venta total esperada:</strong>
<span id="ventaTotal">S/ 0.00</span></p>

<p><strong>Ganancia total:</strong>
<span id="gananciaTotal">S/ 0.00</span></p>

<div class="precio" id="precioFinal">
S/ 0.00
</div>

</div>

</div>

<script>

function calcular(){

    let costo =
    parseFloat(document.getElementById("costo").value) || 0;

    let cantidad =
    parseFloat(document.getElementById("cantidad").value) || 1;

    let pasajes =
    parseFloat(document.getElementById("pasajes").value) || 0;

    let otros =
    parseFloat(document.getElementById("otros").value) || 0;

    let porcentaje =
    parseFloat(document.getElementById("ganancia").value) || 0;

    let pasajeUnidad =
    pasajes / cantidad;

    let otrosUnidad =
    otros / cantidad;

    let costoReal =
    costo +
    pasajeUnidad +
    otrosUnidad;

    let gananciaUnidad =
    costoReal *
    porcentaje / 100;

    let precioVenta =
    costoReal +
    gananciaUnidad;

    let precioRedondeado =
    Math.ceil(precioVenta);

    let inversionTotal =
    (costo * cantidad) +
    pasajes +
    otros;

    let ventaTotal =
    precioRedondeado *
    cantidad;

    let gananciaTotal =
    ventaTotal -
    inversionTotal;

    document.getElementById("pasajeUnidad").innerText =
    "S/ " + pasajeUnidad.toFixed(2);

    document.getElementById("otrosUnidad").innerText =
    "S/ " + otrosUnidad.toFixed(2);

    document.getElementById("costoReal").innerText =
    "S/ " + costoReal.toFixed(2);

    document.getElementById("gananciaUnidad").innerText =
    "S/ " + gananciaUnidad.toFixed(2);

    document.getElementById("precioUnitario").innerText =
    "S/ " + precioVenta.toFixed(2);

    document.getElementById("stockTotal").innerText =
    cantidad;

    document.getElementById("inversionTotal").innerText =
    "S/ " + inversionTotal.toFixed(2);

    document.getElementById("ventaTotal").innerText =
    "S/ " + ventaTotal.toFixed(2);

    document.getElementById("gananciaTotal").innerText =
    "S/ " + gananciaTotal.toFixed(2);

    document.getElementById("precioFinal").innerText =
    "S/ " + precioRedondeado.toFixed(2);

}

function enviarWhatsApp(){

    let producto =
    document.getElementById("producto").value;

    let cantidad =
    document.getElementById("cantidad").value;

    let precio =
    document.getElementById("precioFinal").innerText;

let mensaje =
    "📋 COTIZACIÓN\n\n" +
    "Producto: " + producto +
    "\nCantidad: " + cantidad +
    "\nPrecio Unitario: " + precio;

    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(mensaje),
        "_blank"
    );

}

</script>

</body>
</html>
