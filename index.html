<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Ventas</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:15px;
}

.card{
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,.10);
}

h1{
    text-align:center;
    color:#059669;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.btn-calcular{
    background:#10b981;
}

.btn-whatsapp{
    background:#25d366;
}

.btn-limpiar{
    background:#f59e0b;
}

.btn-borrar{
    background:#ef4444;
}

.resultado{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:#ecfdf5;
}

.resultado p{
    margin:8px 0;
}

.precio{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#059669;
    margin-top:15px;
}

.historial{
    margin-top:20px;
}

.item{
    background:#f8fafc;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
    border-left:5px solid #10b981;
}

.pequeno{
    color:#666;
    font-size:12px;
}

</style>
</head>
<body>

<div class="card">

<h1>💰 Calculadora de Ventas</h1>

<label>Producto</label>
<input type="text" id="producto" placeholder="Ejemplo: Audífono Bluetooth">

<label>Costo del producto (S/)</label>
<input type="number" id="costo" step="0.01">

<label>Cantidad comprada</label>
<input type="number" id="cantidad" value="1">

<label>Pasajes Totales (S/)</label>
<input type="number" id="pasajes" step="0.01">

<label>Otros gastos (S/)</label>
<input type="number" id="otros" step="0.01">

<label>Ganancia (%)</label>
<input type="number" id="ganancia" value="60">

<button class="btn-calcular" onclick="calcular()">
📊 Calcular Precio
</button>

<div class="resultado">

<p><strong>Costo unitario real:</strong>
<span id="costoReal">S/ 0.00</span>
</p>

<p><strong>Ganancia:</strong>
<span id="gananciaSoles">S/ 0.00</span>
</p>

<p><strong>Precio calculado:</strong>
<span id="precioCalculado">S/ 0.00</span>
</p>

<div class="precio" id="precioRedondeado">
S/ 0.00
</div>

</div>

<button class="btn-whatsapp" onclick="compartirWhatsApp()">
📱 Compartir por WhatsApp
</button>

<button class="btn-limpiar" onclick="resetearCampos()">
🧹 Limpiar Campos
</button>

<button class="btn-borrar" onclick="borrarHistorial()">
🗑️ Borrar Historial
</button>

<div class="historial">

<h3>📋 Historial</h3>

<div id="listaHistorial"></div>

</div>

</div>

<script>

let mensajeWhatsapp = "";

cargarHistorial();

function calcular(){

    let producto =
    document.getElementById("producto").value;

    let costo =
    parseFloat(document.getElementById("costo").value) || 0;

    let cantidad =
    parseFloat(document.getElementById("cantidad").value) || 1;

    let pasajes =
    parseFloat(document.getElementById("pasajes").value) || 0;

    let otros =
    parseFloat(document.getElementById("otros").value) || 0;

    let porcentaje =
    parseFloat(document.getElementById("ganancia").value) || 0;

    let pasajeUnidad =
    pasajes / cantidad;

    let costoReal =
    costo + pasajeUnidad + otros;

    let ganancia =
    costoReal * porcentaje / 100;

    let precio =
    costoReal + ganancia;

    let precioRedondeado =
    Math.ceil(precio);

    document.getElementById("costoReal").innerText =
    "S/ " + costoReal.toFixed(2);

    document.getElementById("gananciaSoles").innerText =
    "S/ " + ganancia.toFixed(2);

    document.getElementById("precioCalculado").innerText =
    "S/ " + precio.toFixed(2);

    document.getElementById("precioRedondeado").innerText =
    "Precio sugerido: S/ " + precioRedondeado.toFixed(2);

    mensajeWhatsapp =
    "🛒 Producto: " + producto +
    "%0A💲 Costo Real: S/ " + costoReal.toFixed(2) +
    "%0A📈 Ganancia: " + porcentaje + "%" +
    "%0A✅ Precio Venta: S/ " + precioRedondeado.toFixed(2);

    guardarHistorial(
        producto,
        precioRedondeado
    );

}

function compartirWhatsApp(){

    if(mensajeWhatsapp === ""){
        alert("Primero calcula un producto");
        return;
    }

    window.open(
        "https://wa.me/?text=" + mensajeWhatsapp,
        "_blank"
    );
}

function resetearCampos(){

    document.getElementById("producto").value = "";
    document.getElementById("costo").value = "";
    document.getElementById("cantidad").value = 1;
    document.getElementById("pasajes").value = "";
    document.getElementById("otros").value = "";
    document.getElementById("ganancia").value = 60;

    document.getElementById("costoReal").innerText =
    "S/ 0.00";

    document.getElementById("gananciaSoles").innerText =
    "S/ 0.00";

    document.getElementById("precioCalculado").innerText =
    "S/ 0.00";

    document.getElementById("precioRedondeado").innerText =
    "S/ 0.00";

    mensajeWhatsapp = "";
}

function guardarHistorial(producto, precio){

    if(producto === "") return;

    let historial =
    JSON.parse(
        localStorage.getItem("historial")
    ) || [];

    historial.unshift({
        producto: producto,
        precio: precio,
        fecha: new Date().toLocaleString()
    });

    historial = historial.slice(0,50);

    localStorage.setItem(
        "historial",
        JSON.stringify(historial)
    );

    cargarHistorial();
}

function cargarHistorial(){

    let historial =
    JSON.parse(
        localStorage.getItem("historial")
    ) || [];

    let html = "";

    historial.forEach(item => {

        html += `
        <div class="item">
            <strong>${item.producto}</strong><br>
            Precio: S/ ${item.precio}<br>
            <span class="pequeno">${item.fecha}</span>
        </div>
        `;

    });

    document.getElementById("listaHistorial").innerHTML = html;
}

function borrarHistorial(){

    if(confirm("¿Deseas borrar todo el historial?")){

        localStorage.removeItem("historial");

        document.getElementById("listaHistorial").innerHTML = "";

        alert("Historial eliminado correctamente");

    }

}

</script>

</body>
</html>
